[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

# Keep debuginfo in host-side artifacts (build scripts, proc macros). Apple's
# ld 27037 (Xcode 27) emits proc-macro dylibs with a mis-aligned LINKEDIT
# string pool when built without debuginfo, and macOS 27's dyld refuses to
# load them ("mis-aligned LINKEDIT string pool"). Debuginfo changes the
# LINKEDIT layout enough to avoid it. Has no effect on the on-chain binary.
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
debug = 2
